name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontmatter:
    name: SKILL.md frontmatter & plugin check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check frontmatter and plugin manifest
        run: npm run check-frontmatter
